name: IndexNow Submit

# After a successful GitHub Pages deployment, submit the URLs whose main
# CONTENT changed in this deploy to IndexNow (Bing, Yandex, and other
# participants). We diff the rendered content region, not the file bytes:
# our CSS is inlined, so a cosmetic deploy rewrites every page's bytes
# without changing anything indexable, and byte-diffing made us resubmit
# the whole site repeatedly (Bing flags that as batch abuse).
# The key is derived from the committed key file in docs/, so no secret and
# no Supabase are needed in CI.

on:
  deployment_status: {}

# Read-only token: contents for the diff, deployments to find the prior deploy.
permissions:
  contents: read
  deployments: read

# Never let two submit runs overlap; the latest deploy wins.
concurrency:
  group: indexnow-submit
  cancel-in-progress: false

jobs:
  submit:
    # Only on a SUCCESSFUL github-pages deployment, not other states/environments.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'github-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, needed to diff against the prior deploy)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit changed page URLs to IndexNow
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          SITE="https://pillsignal.com"
          ENDPOINT="https://api.indexnow.org/IndexNow"

          # --- 1. Derive the IndexNow key from the committed key file (no secret) ---
          KEYFILE=$(find docs -maxdepth 1 -type f -regextype posix-extended \
            -regex 'docs/[0-9a-f]{8,128}\.txt' | head -1 || true)
          if [ -z "$KEYFILE" ]; then
            echo "No IndexNow key file in docs/; nothing to do."; exit 0
          fi
          KEY=$(basename "$KEYFILE" .txt)
          echo "Key file: $KEYFILE"

          # --- 2. Find the previous successful github-pages deployment SHA ---
          PREV_SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/deployments?environment=github-pages&per_page=100" \
            --jq "[.[] | select(.sha != \"${DEPLOY_SHA}\")] | .[0].sha" 2>/dev/null || true)

          # --- 3. Choose the diff base ---
          if [ -z "$PREV_SHA" ] || [ "$PREV_SHA" = "null" ]; then
            echo "No prior deployment found; diffing against parent of ${DEPLOY_SHA}."
            BASE="${DEPLOY_SHA}^"
          else
            echo "Prior deployment: ${PREV_SHA}"
            BASE="$PREV_SHA"
          fi

          # Edge case: base unavailable (first commit, or force-push rewrote history)
          # -> submit nothing rather than guess.
          if ! git rev-parse --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            echo "Diff base unavailable; submitting nothing."; exit 0
          fi

          # --- 4. Changed HTML pages, additions/modifications only (skip deletions) ---
          CHANGED=$(git diff --no-renames --diff-filter=ACMRT --name-only \
            "$BASE" "$DEPLOY_SHA" -- 'docs/**/*.html' || true)

          # --- 4b. Keep only pages whose MAIN CONTENT changed, not their bytes ---
          # Our CSS is inlined in <head>, and the header/nav/footer are siblings
          # of the content region, so a cosmetic or chrome-only deploy rewrites
          # every page's bytes without changing what is indexable. Hashing the
          # rendered content region (instead of the file) makes those deploys
          # submit nothing, which is what stops Bing seeing repeated full-site
          # batches. Region = <main> (902 pages) with a fallback to
          # <article class="article-body"> (the 4 guide articles); every page has
          # exactly one. A file missing in BASE (a brand-new page) extracts empty
          # and so differs from its non-empty deploy version -> submitted.
          extract_main() {
            # $1 = "<ref>:<path>"; prints the content region (empty if file/region absent)
            git show "$1" 2>/dev/null | perl -0777 -ne '
              if (/<main\b[^>]*>(.*?)<\/main>/s)                                                 { print $1 }
              elsif (/<article\b[^>]*class="[^"]*\barticle-body\b[^"]*"[^>]*>(.*?)<\/article>/s) { print $1 }
            ' || true
          }
          CONTENT_CHANGED=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in *.html) ;; *) continue ;; esac
            base_hash=$(extract_main "${BASE}:${f}"       | sha256sum | cut -d' ' -f1)
            head_hash=$(extract_main "${DEPLOY_SHA}:${f}" | sha256sum | cut -d' ' -f1)
            if [ "$base_hash" != "$head_hash" ]; then
              CONTENT_CHANGED="${CONTENT_CHANGED}${f}"$'\n'
            fi
          done <<< "$CHANGED"

          # Map docs/<path>/index.html -> clean trailing-slash URL.
          # `|| true` so an empty result (grep finds nothing -> exit 1) does not
          # trip `set -e`; an empty URLS is a valid no-op, not a failure.
          URLS=$(printf '%s\n' "$CONTENT_CHANGED" \
            | grep -E '\.html$' \
            | sed -E "s#^docs/#${SITE}/#; s#index\.html\$##" \
            | sort -u || true)

          COUNT=$(printf '%s\n' "$URLS" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No page CONTENT changed in this deploy (CSS or chrome only); nothing to submit."; exit 0
          fi

          # --- 4c. Tripwire, not a block: a content-changed set this large is a
          # real data refresh and legitimate to submit, but log it loudly so a
          # runaway is noticed rather than silently blasted at IndexNow. ---
          if [ "$COUNT" -gt 500 ]; then
            echo "::warning::IndexNow content-changed set is ${COUNT} URLs (>500); expected only on a full data refresh."
            echo "=============================================================="
            echo "  LARGE SUBMISSION: ${COUNT} URLs changed content this deploy."
            echo "  Legitimate on a data refresh, suspicious otherwise. Submitting."
            echo "=============================================================="
          fi

          echo "Submitting $COUNT content-changed URL(s):"
          printf '%s\n' "$URLS"

          # --- 5. Build the payload and POST once (IndexNow accepts up to 10,000) ---
          PAYLOAD=$(jq -n \
            --arg host "pillsignal.com" \
            --arg key "$KEY" \
            --arg kl "${SITE}/${KEY}.txt" \
            --argjson urls "$(printf '%s\n' "$URLS" | jq -R . | jq -s .)" \
            '{host: $host, key: $key, keyLocation: $kl, urlList: $urls}')

          code=$(curl -sS -o /tmp/indexnow_resp -w '%{http_code}' -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD")
          echo "IndexNow responded HTTP $code"
          cat /tmp/indexnow_resp 2>/dev/null || true; echo

          # 200/202 = accepted. Anything else is a real failure worth surfacing.
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "IndexNow rejected the submission (HTTP $code)."; exit 1
          fi
          echo "Done."
